<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FisioSea · Verificar Gift Card</title>
<style>
  :root{
    --navy:#123B57;
    --navy-deep:#0B2A40;
    --teal:#2FA8CB;
    --teal-light:#8FD3E8;
    --paper:#FCFEFF;
    --ok:#1E8F5E;
    --ok-bg:#E7F6EF;
    --bad:#B5382E;
    --bad-bg:#FBEAE8;
    --ink:#123B57;
    --muted:#5A7787;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 100% 0%, var(--teal-light) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, var(--teal-light) 0%, transparent 40%),
      var(--paper);
    font-family:'Nunito','Segoe UI',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--paper);
    border:2px solid var(--navy);
    border-radius:18px;
    padding:36px 32px 30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(18,59,87,0.12);
  }

  .leaf{
    position:absolute;
    width:150px;
    height:150px;
    opacity:0.18;
    fill:var(--teal);
  }
  .leaf.br{ right:-45px; bottom:-45px; transform:rotate(10deg);}
  .leaf.tl{ left:-45px; top:-45px; transform:rotate(190deg);}

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
    position:relative;
    z-index:1;
  }

  .brand svg{ width:34px; height:34px; }

  .brand-name{
    font-family:'Poppins','Nunito',sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.5px;
  }
  .brand-name span{ color:var(--teal); }

  .brand-sub{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    letter-spacing:1.5px;
    margin-bottom:26px;
    position:relative;
    z-index:1;
  }

  .divider{
    height:1px;
    background:linear-gradient(to right, transparent, var(--navy), transparent);
    opacity:0.25;
    margin:0 0 26px;
  }

  .status-icon{
    width:78px;
    height:78px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .status-icon svg{ width:40px; height:40px; }

  h1{
    text-align:center;
    font-family:'Poppins','Nunito',sans-serif;
    font-size:22px;
    margin:0 0 8px;
    position:relative;
    z-index:1;
  }

  p.desc{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    margin:0 0 22px;
    position:relative;
    z-index:1;
  }

  .code-box{
    background:var(--navy);
    color:#fff;
    text-align:center;
    border-radius:10px;
    padding:14px;
    font-family:'Poppins',monospace;
    font-size:20px;
    letter-spacing:2px;
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }
  .code-box small{
    display:block;
    font-family:'Nunito',sans-serif;
    letter-spacing:0.5px;
    font-size:11px;
    color:var(--teal-light);
    margin-bottom:4px;
  }

  .meta{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }

  button.mark-used{
    display:block;
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:10px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease;
    position:relative;
    z-index:1;
  }
  button.mark-used:hover{ background:var(--navy); }
  button.mark-used:active{ transform:translateY(1px); }
  button.mark-used:disabled{ background:#9db3bd; cursor:default; }

  .staff-note{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:12px;
    position:relative;
    z-index:1;
  }

  .empty-state, .loading-state{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    position:relative;
    z-index:1;
  }

  .error-state{
    text-align:center;
    color:var(--bad);
    font-size:14px;
    line-height:1.6;
    position:relative;
    z-index:1;
  }
</style>
</head>
<body>

<div class="card">
  <svg class="leaf br" viewBox="0 0 100 100"><path d="M50 0 C60 30 90 40 100 100 C40 90 30 60 0 50 C30 40 40 10 50 0 Z"/></svg>
  <svg class="leaf tl" viewBox="0 0 100 100"><path d="M50 0 C60 30 90 40 100 100 C40 90 30 60 0 50 C30 40 40 10 50 0 Z"/></svg>

  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M12 46 C 20 38, 20 28, 12 20" stroke="#123B57" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 50 C 30 40, 30 26, 20 14" stroke="#2FA8CB" stroke-width="5" stroke-linecap="round"/>
      <circle cx="34" cy="16" r="4" fill="#123B57"/>
      <path d="M34 22 L34 34 M28 44 L34 34 L42 40" stroke="#123B57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-name">Fisio<span>Sea</span></div>
  </div>
  <div class="brand-sub">TERAPIA FÍSICA &amp; REHABILITACIÓN</div>
  <div class="divider"></div>

  <div id="result">
    <div class="loading-state">Verificando...</div>
  </div>
</div>

<!-- Firebase (SDK compat, no requiere instalar nada) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ---------------------------------------------------------------
  // PEGA AQUÍ TU CONFIG DE FIREBASE
  // (Firebase Console > ⚙️ Configuración del proyecto > Tus apps > Web)
  // ---------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "PEGA_AQUI_TU_CONFIG",
    authDomain: "PEGA_AQUI_TU_CONFIG",
    projectId: "PEGA_AQUI_TU_CONFIG",
    storageBucket: "PEGA_AQUI_TU_CONFIG",
    messagingSenderId: "PEGA_AQUI_TU_CONFIG",
    appId: "PEGA_AQUI_TU_CONFIG"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  const result = document.getElementById("result");

  async function render(){
    if(!codigo){
      result.innerHTML = `
        <div class="empty-state">
          Escanea el código QR de tu Gift Card<br>para verificar su validez.
        </div>`;
      return;
    }

    let doc;
    try{
      doc = await db.collection("giftcards").doc(codigo).get();
    }catch(err){
      result.innerHTML = `
        <div class="error-state">
          No se pudo conectar para verificar el código.<br>Revisa tu conexión a internet e intenta de nuevo.
        </div>`;
      console.error(err);
      return;
    }

    if(!doc.exists){
      result.innerHTML = `
        <div class="status-icon" style="background:var(--bad-bg)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#B5382E" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <h1 style="color:var(--bad)">Código no encontrado</h1>
        <p class="desc">Este código no corresponde a ninguna Gift Card de FisioSea.</p>
        <div class="code-box"><small>CÓDIGO ESCANEADO</small>${codigo}</div>`;
      return;
    }

    const info = doc.data();

    if(info.usado){
      const fecha = info.fecha || "";
      result.innerHTML = `
        <div class="status-icon" style="background:var(--bad-bg)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#B5382E" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <h1 style="color:var(--bad)">Gift Card ya utilizada</h1>
        <p class="desc">${info.servicio}</p>
        <div class="code-box"><small>CÓDIGO</small>${codigo}</div>
        <div class="meta"><span>Estado</span><span>Usada el ${fecha}</span></div>`;
      return;
    }

    result.innerHTML = `
      <div class="status-icon" style="background:var(--ok-bg)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1E8F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 style="color:var(--ok)">Certificado válido</h1>
      <p class="desc">${info.servicio}</p>
      <div class="code-box"><small>CÓDIGO</small>${codigo}</div>
      <button class="mark-used" id="btnUsar">Marcar como usado</button>
      <div class="staff-note">Solo el personal de FisioSea debe presionar este botón, al momento de realizar el servicio.</div>`;

    document.getElementById("btnUsar").addEventListener("click", marcarUsado);
  }

  async function marcarUsado(){
    const btn = document.getElementById("btnUsar");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    const hoy = new Date().toLocaleDateString('es-MX', { year:'numeric', month:'short', day:'numeric' });

    try{
      await db.collection("giftcards").doc(codigo).update({
        usado: true,
        fecha: hoy
      });
      render();
    }catch(err){
      btn.disabled = false;
      btn.textContent = "Marcar como usado";
      alert("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
      console.error(err);
    }
  }

  render();
</script>

</body>
</html>
